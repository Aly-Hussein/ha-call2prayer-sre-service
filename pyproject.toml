[project]
name = "ha-call2prayer-sre-service"
version = "1.0.0"
description = "A highly available microservice for delivering prayer schedules. Built with SRE principles in mind, it features Prometheus metrics for comprehensive observability and a 72-hour cache degradation fallback for fault tolerance."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx2>=0.28.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]