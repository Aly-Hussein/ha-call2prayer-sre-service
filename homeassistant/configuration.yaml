rest:
  - resource: "http://192.168.2.50:8000/api/v1/today" # Direct to LXC 101 FastAPI port 8000
    scan_interval: 86400 # 24h fallback; controlled explicitly by our 00:03 sync automation
    timeout: 15
    sensor:
      - name: "Mosque Hijri Date"
        unique_id: mosque_hijri_date
        value_template: "{{ value_json.hijri_date }}"
        json_attributes:
          - cache_status
          - date

      - name: "Fajr Azan"
        unique_id: mosque_fajr_azan
        device_class: timestamp
        value_template: "{{ value_json.fajr_azan }}"

      - name: "Fajr Iqama"
        unique_id: mosque_fajr_iqama
        device_class: timestamp
        value_template: "{{ value_json.fajr_iqama }}"

      - name: "Shurooq"
        unique_id: mosque_shurooq
        device_class: timestamp
        value_template: "{{ value_json.shurooq }}"

      - name: "Zuhr Azan"
        unique_id: mosque_zuhr_azan
        device_class: timestamp
        value_template: "{{ value_json.zuhr_azan }}"

      - name: "Zuhr Iqama"
        unique_id: mosque_zuhr_iqama
        device_class: timestamp
        value_template: "{{ value_json.zuhr_iqama }}"

      - name: "Asr Azan"
        unique_id: mosque_asr_azan
        device_class: timestamp
        value_template: "{{ value_json.asr_azan }}"

      - name: "Asr Iqama"
        unique_id: mosque_asr_iqama
        device_class: timestamp
        value_template: "{{ value_json.asr_iqama }}"

      - name: "Maghrib Azan"
        unique_id: mosque_maghrib_azan
        device_class: timestamp
        value_template: "{{ value_json.maghrib_azan }}"

      - name: "Maghrib Iqama"
        unique_id: mosque_maghrib_iqama
        device_class: timestamp
        value_template: "{{ value_json.maghrib_iqama }}"

      - name: "Isha Azan"
        unique_id: mosque_isha_azan
        device_class: timestamp
        value_template: "{{ value_json.isha_azan }}"

      - name: "Isha Iqama"
        unique_id: mosque_isha_iqama
        device_class: timestamp
        value_template: "{{ value_json.isha_iqama }}"

      - name: "Jumah 1st Khutbah"
        unique_id: mosque_jumah_1
        device_class: timestamp
        value_template: "{{ value_json.jumah_1 }}"

      - name: "Jumah 2nd Khutbah"
        unique_id: mosque_jumah_2
        device_class: timestamp
        value_template: "{{ value_json.jumah_2 }}"