# Daily Sensor Sync at 00:03:00 + On Home Assistant Boot
- id: mosque_daily_sync
  alias: "System - Sync Mosque Prayer Times at 00:03 and Startup"
  trigger:
    - platform: time
      at: "00:03:00"
    - platform: homeassistant
      event: start
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.fajr_azan