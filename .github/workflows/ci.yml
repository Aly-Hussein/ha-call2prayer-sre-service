name: SRE CI & Upstream Contract Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs every Monday at 06:00 UTC to detect upstream DOM/JS drift
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Ruff Linter
        run: ruff check src/ tests/
      - name: Run Pytest Unit Suite
        run: pytest --cov=src tests/

  live-upstream-contract-test:
    runs-on: ubuntu-latest
    needs: unit-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Verify Live HTML Contract
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from fetcher import fetch_upstream_html
          from parser import extract_mpt_dict, parse_day_string
          html = fetch_upstream_html()
          mpt = extract_mpt_dict(html)
          first_key = sorted(mpt.keys())[0]
          sched = parse_day_string(first_key, mpt[first_key])
          print(f'Contract Verified! Parsed {first_key}: Fajr Azan = {sched.fajr_azan}')
          "

  docker-build-verify:
    runs-on: ubuntu-latest
    needs: unit-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Rootless Docker Image
        run: docker build -t ha-call2prayer-sre-service:test .